<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MDRT Earning Opportunity</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=Instrument+Serif&display=swap" rel="stylesheet">

<style>
:root{
  --maroon:#6E1423;
  --maroon-deep:#4A0F1C;
  --red:#C8323F;
  --red-error:#A11A2B;
  --grey:#5B534F;
  --grey-soft:#8C8582;
  --line:#E4DFDD;
  --paper:#FFFFFF;
  --success:#2A7F5F;
  --font-display:'Instrument Serif', Georgia, serif;
  --font-body:'IBM Plex Sans', -apple-system, 'Segoe UI', sans-serif;
}

*{margin:0;padding:0;box-sizing:border-box;}

html,body{height:100%;}

body{
  position:relative;
  min-height:100vh;
  overflow-x:hidden;
  font-family:var(--font-body);
  color:var(--grey);
  background:var(--maroon-deep);
}

/* Background image - unchanged */
.bg-photo{
  position:fixed;
  inset:0;
  z-index:0;
  overflow:hidden;
  background:linear-gradient(160deg,var(--maroon) 0%,var(--maroon-deep) 100%);
}

.bg-photo img{
  width:100%;
  height:100%;
  object-fit:contain;
  object-position:center top;
  display:block;
}

.bg-overlay{
  position:absolute;
  inset:0;
  background:
    linear-gradient(180deg, rgba(74,15,28,0) 0%, rgba(74,15,28,0) 55%, rgba(35,8,17,.35) 100%);
}

/* Layout - card remains fixed */
.stage{
  position:relative;
  z-index:2;
  min-height:100vh;
}

/* Form card - fixed at the bottom */
.card{
  position:fixed;
  z-index:2;
  left:50%;
  bottom:28vh;
  transform:translateX(-50%);
  width:calc(100% - 40px);
  max-width:420px;
  background:rgba(255,255,255,.96);
  -webkit-backdrop-filter:blur(8px);
  backdrop-filter:blur(8px);
  border-radius:14px;
  overflow:hidden;
  padding:36px 30px 30px;
  text-align:center;
  box-shadow:0 22px 50px rgba(20,4,9,.35);
  animation:rise .7s ease both;
}

.card::before{
  content:"";
  position:absolute;
  top:0;
  left:0;
  right:0;
  height:4px;
  background:linear-gradient(90deg,var(--maroon) 0%,var(--maroon) 70%,var(--red) 100%);
}

@keyframes rise{
  from{opacity:0;transform:translate(-50%,14px);}
  to{opacity:1;transform:translate(-50%,0);}
}

.sr-only{
  position:absolute;
  width:1px;
  height:1px;
  overflow:hidden;
  clip:rect(0 0 0 0);
  white-space:nowrap;
}

.subcopy{
  font-size:15px;
  line-height:1.55;
  color:var(--grey);
  max-width:320px;
  margin:0 auto 20px;
}

/* Form */
.input-wrap{
  margin-bottom:14px;
}

input{
  display:block;
  width:100%;
  padding:14px 16px;
  font-size:16px;
  font-family:var(--font-body);
  color:var(--maroon-deep);
  background:#FAF8F8;
  border:1px solid var(--line);
  border-radius:8px;
  outline:none;
  text-align:center;
  transition:border-color .2s ease, box-shadow .2s ease, background .2s ease;
}

input::placeholder{
  color:var(--grey-soft);
}

input:focus{
  border-color:var(--maroon);
  background:#fff;
  box-shadow:0 0 0 3px rgba(110,20,35,.12);
}

button{
  width:100%;
  padding:14px;
  border:none;
  border-radius:8px;
  cursor:pointer;
  background:var(--maroon);
  color:#fff;
  font-family:var(--font-body);
  font-weight:600;
  font-size:16px;
  letter-spacing:.02em;
  transition:background .2s ease, transform .2s ease;
}

button:hover{
  background:var(--red);
}

button:active{
  transform:translateY(1px);
}

button:disabled{
  opacity:.6;
  cursor:not-allowed;
  background:var(--maroon);
}

button:focus-visible,
input:focus-visible{
  outline:2px solid var(--red);
  outline-offset:2px;
}

.loader{
  display:none;
  margin-top:16px;
  align-items:center;
  justify-content:center;
  gap:8px;
  font-size:14px;
  color:var(--grey);
}

.loader.show{
  display:flex;
}

.spinner{
  width:14px;
  height:14px;
  border:2px solid rgba(110,20,35,.18);
  border-top-color:var(--maroon);
  border-radius:50%;
  display:inline-block;
  animation:spin .8s linear infinite;
}

@keyframes spin{
  to{transform:rotate(360deg);}
}

#msg{
  margin-top:14px;
  text-align:center;
  font-weight:500;
  font-size:15px;
}

#msg:empty{
  margin-top:0;
}

.success{
  color:var(--success);
}

.error{
  color:var(--red-error);
}

@media (max-width:480px){
  .card{
    width:calc(100% - 28px);
    bottom:26vh;
    padding:30px 22px 22px;
  }
}

/* Prevent the card from extending beyond short screens */
@media (max-height:500px){
  .card{
    bottom:10px;
    max-height:calc(100vh - 20px);
    overflow-y:auto;
    padding-top:26px;
    padding-bottom:20px;
  }

  .subcopy{
    margin-bottom:12px;
  }
}

@media (prefers-reduced-motion: reduce){
  *, *::before, *::after{
    animation-duration:.001ms !important;
    animation-iteration-count:1 !important;
    transition-duration:.001ms !important;
  }
}
</style>
</head>

<body>

<div class="bg-photo" aria-hidden="true">
  <img src="https://imgh.in/host/cg8xhs" alt="">
  <div class="bg-overlay"></div>
</div>

<main class="stage">
  <section class="card">

    <h1 class="sr-only">MDRT Earning Opportunity</h1>

    <p class="subcopy">
      Enter your details below to view your personalised experience
    </p>

    <div class="input-wrap">
      <input
        id="input"
        placeholder="Advisor code / SAP ID / Mobile No."
        autocomplete="off"
      >
    </div>

    <button onclick="searchDoc()" id="btn">
      Click to view &amp; download!
    </button>

    <div class="loader" id="loader">
      <span class="spinner"></span>
      <span>Searching...</span>
    </div>

    <div id="msg"></div>

  </section>
</main>

<script>
const API_URL="https://script.google.com/macros/s/AKfycbygyXowrnYk-9UR8iMeI3_znbVkEFcKdbQ8V9prXYfZM8ZKvvo9q-xlDNUDo67XvUw/exec";

async function searchDoc(){
  const value=document.getElementById("input").value.trim();
  const msg=document.getElementById("msg");
  const loader=document.getElementById("loader");
  const btn=document.getElementById("btn");
  msg.innerHTML="";
  if(value===""){
    msg.className="error";
    msg.innerHTML="Please enter your L1 code, Employee ID or Mobile Number.";
    return;
  }
  loader.classList.add("show");
  btn.disabled=true;
  try{
    const response=await fetch(API_URL+"?input="+encodeURIComponent(value));
    const data=await response.json();
    loader.classList.remove("show");
    btn.disabled=false;
    if(data.status==="success"){
      msg.className="success";
      msg.innerHTML="Agenda found! Downloading...";
      window.open(data.url,"_blank");
    }else{
      msg.className="error";
      msg.innerHTML=data.message;
    }
  }catch(err){
    loader.classList.remove("show");
    btn.disabled=false;
    msg.className="error";
    msg.innerHTML="Unable to connect to server.";
  }
}
</script>

</body>
</html>
